[workspace]
resolver = "2"
members = ["crates/core", "crates/unpack", "crates/identify", "crates/emit", "crates/cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.91"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
blake3 = "1"
flate2 = "1"
lzma-rs = "0.3"
regex = "1"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
